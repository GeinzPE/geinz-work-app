# ============================================================
#  GRADLE PROPERTIES - CONFIGURACIÓN SEGURA Y OPTIMIZADA
#  Esta configuración NO borra código ni recursos.
#  Solo mejora rendimiento y evita errores OutOfMemory.
# ============================================================

# Aumenta RAM disponible para el compilador de Gradle
# (evita el error: Java heap space / OutOfMemory)
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Aumenta RAM del demonio de Kotlin (seguro)
kotlin.daemon.jvmargs=-Xmx2048m

# Usa AndroidX obligatoriamente
android.useAndroidX=true

# Migra bibliotecas antiguas a AndroidX automáticamente
android.enableJetifier=true

# Mantener estilo de código oficial de Kotlin
kotlin.code.style=official

# Reduce tamaño de la clase R en librerías
android.nonTransitiveRClass=true

# Desactiva COMPILACIÓN INCREMENTAL de Kotlin temporalmente
# ?? Esto evita el error del compilador:
# ProtoMapValueExternalizer.read / IncrementalJvmCache
# Luego podemos activarlo de nuevo cuando ya compile bien.
kotlin.incremental=false

# ============================================================
#  FIN DEL ARCHIVO
# ============================================================

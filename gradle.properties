# ============================================================
#  GRADLE PROPERTIES - CONFIGURACIÓN OPTIMIZADA PARA 23GB RAM
# ============================================================

# Gradle JVM (todo el proceso Gradle)
# Le damos 8GB para manejar compilaciones grandes
org.gradle.jvmargs=-Xmx8192m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin daemon (compilador)
# Le damos 6GB para compilaciones de Kotlin pesadas (Compose)
kotlin.daemon.jvmargs=-Xmx6144m -Dkotlin.compiler.execution.strategy=in-process

# Usa AndroidX obligatoriamente
android.useAndroidX=true

# Migra automáticamente bibliotecas antiguas a AndroidX
android.enableJetifier=true

# Mantener estilo de código oficial de Kotlin
kotlin.code.style=official

# Reduce tamaño de la clase R en librerías
android.nonTransitiveRClass=true

# Compilación incremental de Kotlin (útil en proyectos grandes)
kotlin.incremental=true

# Habilitar paralelismo en la compilación de Gradle
org.gradle.parallel=true

# Habilitar caché de construcción para acelerar compilaciones repetidas
org.gradle.caching=true

# ============================================================
#  FIN DEL ARCHIVO
# ============================================================
